defaults:
  - _self_
  - dataset: "zebrafish"

pc_dim: -1
num_classes: -1

seed: 42

# Trainer settings
classifier_max_epochs: 1000
metric_max_epochs: 3000
embed_max_epochs: 3000
flow_max_epochs: 2
gradient_clip_val: 0
warmup_steps: 0

loader_batch_size: 6
flow_batch_size: 512
score_batch_size: 2048
ema_decay: 1-1e-3

use_paga: False
paga_threshold: 0.0

# Model Hparams
lr: 1e-3
dropout: 0.0
hidden_dim: 256
latent_dim: 100
num_layers: 3
num_freq: 32

rescale: 0.5
skip: False
normalize: True
balance_classes: False

# Debug settings
force_cpu: False
detect_anomaly: False
use_wandb: True

# Classifier settings
dummy_prior: 0.05
dummy_kl_weight: 0.05

classifier:
  hidden_dim: 20
  num_layers: 1
  spectral_norm: False
  epsilon: 0.0

# Metric / Flow settings
metric: "cfm"
sigma: 0.0
ot_in_embed: True
fast_ot: False
no_learning: False
time_per_batch: 4
random_velocities: False

method: "exact"
reg: -1
reg_m: -1

mfm:
  K: 150
  kappa: 1.5
  alpha: 1.0
  epsilon: 1e-1
  use_euclidean_ot: False

finsler:
  use: False
  temp: 1.0
  lamb: 1.0

gaga:
  # Autoencoder settings
  ae_latent_dim: 3
  ae_hidden_dims: [256, 128, 64]
  ae_dropout: 0.2
  ae_use_spectral_norm: false
  ae_dist_mse_decay: 0.0
  ae_weights_dist: 77.4
  ae_lr: 1e-3
  ae_weight_decay: 1e-5
  ae_max_epochs: 100
  ae_batch_size: 32
  distance_key: "dist"

  # Discriminator settings
  disc_hidden_dims: [256, 128, 64]
  disc_lr: 1e-3
  disc_weight_decay: 1e-4
  disc_max_epochs: 100
  disc_batch_size: 128
  disc_dropout: 0.5
  disc_use_spectral_norm: true
  disc_factor: 5.0

  # Negative sampling
  noise_levels: [0.5, 1.0]
  sampling_rejection: false
  sampling_rejection_method: "sugar"
  sampling_rejection_k: 20
  sampling_rejection_threshold: 0.2
