# W&B Sweep configuration for finfm hyperparameter search
#
# Usage (single command):
#   python -m scripts.sweep                           # all combinations
#   python -m scripts.sweep --count 20                # cap at 20 trials
#   python -m scripts.sweep --dataset cite --count 10 # different dataset
#
# Structure:
#   shared: params cross-producted into every run
#   groups: list of conditional param blocks; each group × shared = run subset
#           union of all groups gives the full (non-redundant) run list
#
# Example extension — add mfm metric with its own hyperparams:
#   groups:
#     - finsler.use: [true]
#       finsler.lamb: [0.5, 1.0]
#     - finsler.use: [false]

metric:
  name: w1_avg
  goal: minimize

shared:
  classifier.hidden_dim: [128]
  classifier.num_layers: [2]
  classifier.epsilon: [0.05, 0.1]
  use_euclidean_ot: [true, false]
  seed: [1, 2]

groups:
  # finsler on: lamb is meaningful, sweep it
  - metric: ["cfm"]
  
  - finsler.use: [true]
    finsler.lamb: [0.5, 1.0]
  # finsler off: no lamb parameter needed
  - finsler.use: [false]
  - metric: ["mfm"]
    mfm.K: [100, 150, 200]
    mfm.kappa: [1.0, 1.5]

