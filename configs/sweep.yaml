# W&B Sweep configuration for finfm hyperparameter search
#
# Usage (single command):
#   python -m scripts.sweep                           # unlimited trials
#   python -m scripts.sweep --count 20                # cap at 20 trials
#   python -m scripts.sweep --dataset cite --count 10 # different dataset
#

method: grid

metric:
  name: w1_avg
  goal: minimize

parameters:

  # classifier_max_epochs:
  #   values: [2]
  # metric_max_epochs:
  #   values: [500]
  # embed_max_epochs:
  #   values: [2]

  metric:
    values: ["mfm"]
  finsler.use:
    values: [true, false]
  finsler.lamb:
    values: [0.5]
  classifier.hidden_dim:
    values: [256]
  classifier.num_layers:
    values: [2]
  classifier.epsilon:
    values: [0.05]
  mfm.K:
    values: [200]
  mfm.kappa:
    values: [2.0]
  mfm.epsilon:
    values: [5e-2]
  seed:
    values: [1,2,3]